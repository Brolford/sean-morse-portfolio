  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-left">
        <a href="#/" data-nav="work">Work</a>
        <a href="#/archive" data-nav="archive">Archive</a>
      </div>
      <div class="nav-center">
        <a href="#/">Sean Morse</a>
      </div>
      <div class="nav-right">
        <a href="#/about" data-nav="about">About</a>
        <a href="#" data-nav="contact" id="nav-contact" style="margin-left: 24px;">Contact</a>
      </div>
      <button class="nav-hamburger" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Nav Overlay -->
  <div class="mobile-nav-overlay">
    <a href="#/">Work</a>
    <a href="#/archive">Archive</a>
    <a href="#/about">About</a>
    <a href="#" class="mobile-contact-trigger">Contact</a>
  </div>

  <!-- Contact Modal -->
  <div class="contact-overlay" id="contact-overlay">
    <div class="contact-backdrop" id="contact-backdrop"></div>
    <div class="contact-modal">
      <button class="contact-modal-close" id="contact-close" aria-label="Close">&times;</button>
      <h2 class="contact-modal-title">Get in touch.</h2>
      <p class="contact-modal-sub">Have a project in mind? Fill this out and it'll open in your email, ready to send.</p>
      <form class="contact-form" id="contact-form">
        <div class="contact-row">
          <div class="contact-field">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="name" placeholder="Your name" required>
          </div>
          <div class="contact-field">
            <label for="contact-company">Company</label>
            <input type="text" id="contact-company" name="company" placeholder="Your company" required>
          </div>
        </div>
        <div class="contact-row">
          <div class="contact-field">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="contact-field">
            <label for="contact-project-type">Project Type</label>
            <select id="contact-project-type" name="project_type" required>
              <option value="" disabled selected>Select a service</option>
              <option value="Brand Identity">Brand Identity</option>
              <option value="Packaging Design">Packaging Design</option>
              <option value="Brand Strategy">Brand Strategy</option>
              <option value="Art Direction">Art Direction</option>
              <option value="Full Brand Development">Full Brand Development</option>
              <option value="Brand Refresh / Evolution">Brand Refresh / Evolution</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="contact-field">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" placeholder="Tell Sean about your project..." required></textarea>
        </div>
        <button type="submit" class="contact-submit">Send Message</button>
      </form>
    </div>
  </div>

  <!-- App Mount -->
  <main id="app" class="page-view"></main>

  <!-- App Script -->
  <script type="module" src="app.js"></script>

</body>
</html>
